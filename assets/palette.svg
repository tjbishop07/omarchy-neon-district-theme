<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Neon District palette and terminal illustration</title>
<desc id="desc">Cyan and pink gradient border, six theme color swatches, and an illustrative terminal prompt.</desc>
<defs><linearGradient id="border" x2="1" y2="1"><stop stop-color="#36f9f6"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient></defs>
<rect width="960" height="400" rx="16" fill="#0b0914"/>
<rect x="2" y="2" width="956" height="396" rx="14" fill="none" stroke="url(#border)" stroke-width="3"/>
<text x="32" y="46" fill="#36f9f6" font-family="monospace" font-size="20">NEON DISTRICT / COLOR SYSTEM</text>
<rect x="32" y="72" width="136" height="62" rx="6" fill="#36f9f6"/>
<text x="32" y="158" fill="#e5def5" font-family="monospace" font-size="14">Electric cyan</text>
<text x="32" y="180" fill="#a59abb" font-family="monospace" font-size="14">#36f9f6</text>
<rect x="184" y="72" width="136" height="62" rx="6" fill="#ff4f9a"/>
<text x="184" y="158" fill="#e5def5" font-family="monospace" font-size="14">Hot pink</text>
<text x="184" y="180" fill="#a59abb" font-family="monospace" font-size="14">#ff4f9a</text>
<rect x="336" y="72" width="136" height="62" rx="6" fill="#82aaff"/>
<text x="336" y="158" fill="#e5def5" font-family="monospace" font-size="14">Blue</text>
<text x="336" y="180" fill="#a59abb" font-family="monospace" font-size="14">#82aaff</text>
<rect x="488" y="72" width="136" height="62" rx="6" fill="#8cf5b0"/>
<text x="488" y="158" fill="#e5def5" font-family="monospace" font-size="14">Mint</text>
<text x="488" y="180" fill="#a59abb" font-family="monospace" font-size="14">#8cf5b0</text>
<rect x="640" y="72" width="136" height="62" rx="6" fill="#f4ef78"/>
<text x="640" y="158" fill="#e5def5" font-family="monospace" font-size="14">Acid yellow</text>
<text x="640" y="180" fill="#a59abb" font-family="monospace" font-size="14">#f4ef78</text>
<rect x="792" y="72" width="136" height="62" rx="6" fill="#e5def5"/>
<text x="792" y="158" fill="#e5def5" font-family="monospace" font-size="14">Lavender</text>
<text x="792" y="180" fill="#a59abb" font-family="monospace" font-size="14">#e5def5</text>
<rect x="32" y="214" width="896" height="148" rx="8" fill="#151023"/>
<text x="52" y="245" fill="#a59abb" font-family="monospace" font-size="12">TERMINAL PROMPT / ILLUSTRATION</text>
<text x="52" y="285" fill="#36f9f6" font-family="monospace" font-size="19">~/neon-district</text>
<text x="235" y="285" fill="#ff4f9a" font-family="monospace" font-size="19">main</text>
<text x="300" y="285" fill="#36f9f6" font-family="monospace" font-size="19">❯</text>
<text x="330" y="285" fill="#e5def5" font-family="monospace" font-size="19">omarchy theme bg next</text>
<text x="52" y="330" fill="#36f9f6" font-family="monospace" font-size="19">~/neon-district</text>
<text x="235" y="330" fill="#ff4f9a" font-family="monospace" font-size="19">main</text>
<text x="300" y="330" fill="#f4ef78" font-family="monospace" font-size="19">✗</text>
<text x="330" y="330" fill="#a59abb" font-family="monospace" font-size="16">error indicator</text>
</svg>
